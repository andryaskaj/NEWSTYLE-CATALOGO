<<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW STYLE - Catálogo Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo: #050505; --surface: #111111; --accent: #e60000;
            --text: #ffffff; --text-muted: #a0a0a0; --border: #222222;
        }

        body { background-color: var(--fundo); color: var(--text); font-family: 'Outfit', sans-serif; margin: 0; padding-bottom: 100px; }
        
        /* Header e Logo */
        header { 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 20px; 
            display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000; padding: 15px 5%;
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin: 0; text-transform: uppercase; }
        .btn-header { background: #222; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }

        /* Modal do Carrinho */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: none; z-index: 2000; justify-content: center; align-items: center; 
        }
        .modal-content { 
            background: var(--surface); width: 90%; max-width: 400px; padding: 20px; 
            border-radius: 20px; border: 1px solid var(--border); max-height: 80vh; overflow-y: auto;
        }
        .item-carrinho { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 0; border-bottom: 1px solid #333; 
        }
        .btn-remover { color: var(--accent); cursor: pointer; font-weight: bold; padding: 5px; }

        /* Vitrine e Cards */
        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #161616; border-radius: 16px; border: 1px solid var(--border); padding: 15px; transition: 0.3s; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        .preco { font-size: 1.3rem; font-weight: bold; color: var(--accent); margin: 10px 0; }
        .btn-acao { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        #areaAdmin { display: none; background: #0f0f0f; padding: 20px; margin: 20px auto; border-radius: 15px; max-width: 400px; border: 1px solid var(--accent); }
        input, select { width: 100%; padding: 10px; background: #222; color: white; border: 1px solid #333; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">NEW STYLE</h1>
        <div>
            <button onclick="window.acessarAdmin()" class="btn-header">Admin</button>
            <button onclick="window.abrirCarrinho()" class="btn-header" style="background: var(--accent);">Carrinho</button>
        </div>
    </header>

    <div id="modalCarrinho" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-top:0;">Seu Carrinho</h2>
            <div id="lista-carrinho"></div>
            <h3 id="total-carrinho" style="text-align: right;">Total: R$ 0,00</h3>
            <button onclick="window.finalizarPedido()" class="btn-acao">Finalizar Pedido (WhatsApp)</button>
            <button onclick="window.fecharCarrinho()" style="background:none; border:none; color:#666; width:100%; margin-top:10px; cursor:pointer;">Fechar</button>
        </div>
    </div>

    <div id="areaAdmin">
        <h3>Painel Admin</h3>
        <form id="formAdminProd">
            <input type="text" id="adminNome" placeholder="Nome" required>
            <input type="number" id="adminPreco" placeholder="Preço" required>
            <input type="url" id="adminF1" placeholder="Foto 1" required>
            <button type="submit" class="btn-acao">Salvar Produto</button>
        </form>
    </div>

    <div class="catalogo" id="vitrine"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo9XY0ZVLsFtyxDfRUGSIcqZYpaWnfb9U",
            authDomain: "newstyle-catalogo.firebaseapp.com",
            projectId: "newstyle-catalogo",
            storageBucket: "newstyle-catalogo.firebasestorage.app",
            messagingSenderId: "371496179203",
            appId: "1:371496179203:web:982c39a0f82eee8a10e036",
            measurementId: "G-K7023PTGYY"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        
        window.carrinho = JSON.parse(localStorage.getItem('newstyle_cart')) || [];
        window.produtos = [];

        // Renderização Inicial
        onSnapshot(collection(db, "produtos"), (snap) => {
            window.produtos = [];
            snap.forEach(d => window.produtos.push(d.data()));
            renderizarVitrine();
        });

        // --- Funções do Carrinho ---
        window.abrirCarrinho = () => { document.getElementById('modalCarrinho').style.display = 'flex'; renderizarCarrinho(); };
        window.fecharCarrinho = () => { document.getElementById('modalCarrinho').style.display = 'none'; };

        window.renderizarCarrinho = () => {
            const lista = document.getElementById('lista-carrinho');
            const totalEl = document.getElementById('total-carrinho');
            lista.innerHTML = '';
            let total = 0;

            window.carrinho.forEach((item, index) => {
                total += parseFloat(item.preco);
                lista.innerHTML += `
                    <div class="item-carrinho">
                        <span>${item.nome} - R$ ${parseFloat(item.preco).toFixed(2).replace('.',',')}</span>
                        <span class="btn-remover" onclick="window.removerItem(${index})">X</span>
                    </div>
                `;
            });
            totalEl.innerText = `Total: R$ ${total.toFixed(2).replace('.',',')}`;
        };

        window.removerItem = (index) => {
            window.carrinho.splice(index, 1);
            localStorage.setItem('newstyle_cart', JSON.stringify(window.carrinho));
            renderizarCarrinho();
        };

        window.addCarrinho = (nome, preco) => {
            window.carrinho.push({ nome, preco: parseFloat(preco) });
            localStorage.setItem('newstyle_cart', JSON.stringify(window.carrinho));
            alert(`${nome} adicionado!`);
        };

        window.finalizarPedido = () => {
            if(window.carrinho.length === 0) return alert("Carrinho vazio!");
            let msg = "Olá, gostaria de fazer o pedido:\n";
            let total = 0;
            window.carrinho.forEach(i => { msg += `- ${i.nome}: R$ ${i.preco}\n`; total += i.preco; });
            msg += `\nTotal: R$ ${total.toFixed(2)}`;
            
            // Redirecionamento corrigido
            const url = `https://wa.me/5548992225893?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        };

        // --- Funções Vitrine ---
        function renderizarVitrine() {
            const vitrine = document.getElementById('vitrine');
            vitrine.innerHTML = '';
            window.produtos.forEach(p => {
                vitrine.innerHTML += `
                    <div class="card">
                        <img src="${p.f1}">
                        <h3>${p.nome}</h3>
                        <div class="preco">R$ ${parseFloat(p.preco).toFixed(2).replace('.',',')}</div>
                        <button class="btn-acao" onclick="window.addCarrinho('${p.nome}', '${p.preco}')">Adicionar</button>
                    </div>
                `;
            });
        }

        window.acessarAdmin = () => {
            if (prompt("Senha:") === 'NEWSTYLE26') {
                document.getElementById('areaAdmin').style.display = 'block';
            }
        };

        document.getElementById('formAdminProd').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = Date.now().toString();
            await setDoc(doc(db, "produtos", id), {
                id, nome: document.getElementById('adminNome').value,
                preco: document.getElementById('adminPreco').value,
                f1: document.getElementById('adminF1').value
            });
            alert("Salvo!");
        });
    </script>
</body>
</html>
