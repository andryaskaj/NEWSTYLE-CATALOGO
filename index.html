<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW STYLE - Catálogo Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo: #050505;
            --header: #000000;
            --card-fundo: #fff5f5;
            --card-texto: #111111;
            --texto-claro: #ffffff;
            --accent: #e60000;
        }
        body { background-color: var(--fundo); color: var(--texto-claro); font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 90px; }
        
        header { background-color: var(--header); padding: 20px; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid var(--accent); position: relative; }
        .logo { font-family: 'DynaPuff', cursive; font-size: 2.3rem; color: var(--accent); margin: 0; text-shadow: 2px 2px 0px #000; text-align: center; }
        .btn-admin-topo { position: absolute; right: 20px; background: transparent; color: #666; border: 1px solid #333; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }

        .filtros { display: flex; justify-content: center; gap: 8px; padding: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .filtros button { background: #111; color: white; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-weight: 600; }
        .filtros button.ativo { background: var(--accent); border-color: var(--accent); }

        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-fundo); color: var(--card-texto); padding: 15px; border-radius: 16px; border: 2px solid #ffe0e0; box-shadow: 0 4px 15px rgba(230, 0, 0, 0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card img.foto-principal { width: 100%; height: 240px; object-fit: cover; border-radius: 10px; }
        
        .miniaturas { display: flex; gap: 6px; margin: 10px 0; justify-content: center; }
        .miniaturas img { width: 30%; height: 55px; object-fit: cover; cursor: pointer; border-radius: 6px; border: 2px solid #ddd; }
        
        .card h3 { margin: 10px 0 5px 0; font-size: 1.15rem; font-weight: 600; }
        .card .categoria-tag { font-size: 0.8rem; color: #666; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        .preco { font-size: 1.5rem; font-weight: bold; color: var(--accent); margin: 5px 0 15px 0; }
        
        .btn-acao { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        
        /* Modal Carrinho */
        #modal-carrinho { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #fff; color: #000; width: 100%; max-width: 600px; padding: 20px; border-radius: 20px; max-height: 80vh; overflow-y: auto; }
        #lista-carrinho { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .item-cart { border: 1px solid #ddd; padding: 10px; border-radius: 10px; text-align: center; }
        .item-cart img { width: 100%; height: 80px; object-fit: cover; border-radius: 5px; }

        #areaAdmin { display: none; background: #111; padding: 25px; margin: 20px auto; border-radius: 15px; max-width: 500px; border: 2px solid var(--accent); }
        #areaAdmin input, #areaAdmin select { width: 100%; padding: 12px; background: #222; color: white; border: 1px solid #444; border-radius: 6px; margin-bottom: 12px; }
        #cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--header); padding: 15px; text-align: center; border-top: 3px solid var(--accent); display: none; z-index: 999; }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">NEW STYLE</h1>
        <button onclick="window.acessarAdmin()" class="btn-admin-topo">Painel</button>
    </header>

    <div id="areaAdmin">
        <h2>Cadastrar Produto</h2>
        <form id="formAdminProd">
            <input type="text" id="adminNome" placeholder="Nome" required>
            <select id="adminCategoria">
                <option value="Camisa">Camisa</option><option value="Bermuda">Bermuda</option><option value="Calça">Calça</option><option value="Jaqueta">Jaqueta</option><option value="Moletom">Moletom</option><option value="Boné">Boné</option><option value="Tênis">Tênis</option><option value="Perfume">Perfume</option><option value="Conjuntos">Conjuntos</option>
            </select>
            <input type="number" id="adminPreco" placeholder="Preço" step="0.01" required>
            <input type="url" id="adminF1" placeholder="Foto 1" required>
            <input type="url" id="adminF2" placeholder="Foto 2">
            <input type="url" id="adminF3" placeholder="Foto 3">
            <button type="submit" class="btn-acao">Salvar</button>
            <button type="button" onclick="window.fecharAdmin()" style="width:100%; margin-top:10px; padding:10px;">Fechar</button>
        </form>
    </div>

    <div class="filtros" id="btnsFiltro">
        <button id="btn-todos" class="ativo" onclick="window.filtrar('Todos')">Todos</button>
        <button onclick="window.filtrar('Camisa')">Camisas</button>
        <button onclick="window.filtrar('Bermuda')">Bermudas</button>
        <button onclick="window.filtrar('Calça')">Calças</button>
        <button onclick="window.filtrar('Jaqueta')">Jaquetas</button>
        <button onclick="window.filtrar('Moletom')">Moletons</button>
        <button onclick="window.filtrar('Boné')">Bonés</button>
        <button onclick="window.filtrar('Tênis')">Tênis</button>
        <button onclick="window.filtrar('Perfume')">Perfumes</button>
        <button onclick="window.filtrar('Conjuntos')">Conjuntos</button>
    </div>

    <div class="catalogo" id="vitrine"></div>

    <div id="cart-bar">
        <button onclick="window.abrirCarrinho()" class="btn-acao">🛒 Ver Carrinho</button>
    </div>

    <div id="modal-carrinho" onclick="window.fecharCarrinho()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>🛍️ Seu Carrinho</h2>
            <div id="lista-carrinho"></div>
            <div id="total-carrinho" style="font-size: 1.5rem; font-weight: bold; margin-top:10px; text-align:right;"></div>
            <button onclick="window.finalizarPedido()" class="btn-acao" style="background:#25D366; margin-top:20px;">Enviar Pedido via WhatsApp 💬</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo9XY0ZVLsFtyxDfRUGSIcqZYpaWnfb9U",
            authDomain: "newstyle-catalogo.firebaseapp.com",
            projectId: "newstyle-catalogo",
            storageBucket: "newstyle-catalogo.firebasestorage.app",
            messagingSenderId: "371496179203",
            appId: "1:371496179203:web:982c39a0f82eee8a10e036"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        window.produtos = [];
        window.carrinho = JSON.parse(localStorage.getItem('newstyle_cart')) || [];
        window.categoriaAtual = 'Todos';

        onSnapshot(collection(db, "produtos"), (snap) => {
            window.produtos = [];
            snap.forEach(d => window.produtos.push(d.data()));
            window.renderizar();
        });

        window.renderizar = () => {
            const vitrine = document.getElementById('vitrine');
            vitrine.innerHTML = '';
            const lista = window.categoriaAtual === 'Todos' ? window.produtos : window.produtos.filter(p => p.categoria === window.categoriaAtual);
            
            lista.forEach(p => {
                vitrine.innerHTML += `
                    <div class="card">
                        <div>
                            <span class="categoria-tag">${p.categoria}</span>
                            <img src="${p.f1}" class="foto-principal" id="imgMain-${p.id.replace(/\s/g,'')}">
                            <div class="miniaturas">
                                <img src="${p.f1}" onclick="document.getElementById('imgMain-${p.id.replace(/\s/g,'')}').src='${p.f1}'">
                                ${p.f2 ? `<img src="${p.f2}" onclick="document.getElementById('imgMain-${p.id.replace(/\s/g,'')}').src='${p.f2}'">` : ''}
                                ${p.f3 ? `<img src="${p.f3}" onclick="document.getElementById('imgMain-${p.id.replace(/\s/g,'')}').src='${p.f3}'">` : ''}
                            </div>
                            <h3>${p.nome}</h3>
                        </div>
                        <div>
                            <div class="preco">R$ ${parseFloat(p.preco).toFixed(2).replace('.',',')}</div>
                            <button class="btn-acao" onclick="window.addCarrinho('${p.nome}', '${p.preco}', '${p.f1}')">Adicionar</button>
                        </div>
                    </div>`;
            });
        };

        window.addCarrinho = (nome, preco, foto) => {
            window.carrinho.push({ nome, preco: parseFloat(preco), foto });
            localStorage.setItem('newstyle_cart', JSON.stringify(window.carrinho));
            document.getElementById('cart-bar').style.display = 'block';
        };

        window.abrirCarrinho = () => {
            document.getElementById('modal-carrinho').style.display = 'flex';
            const lista = document.getElementById('lista-carrinho');
            const totalDiv = document.getElementById('total-carrinho');
            lista.innerHTML = '';
            let total = 0;
            window.carrinho.forEach((item, index) => {
                total += item.preco;
                lista.innerHTML += `
                    <div class="item-cart">
                        <img src="${item.foto}">
                        <div style="font-size:0.8rem">${item.nome}</div>
                        <b>R$ ${item.preco.toFixed(2).replace('.',',')}</b>
                    </div>`;
            });
            totalDiv.innerText = `Total: R$ ${total.toFixed(2).replace('.',',')}`;
        };

        window.fecharCarrinho = () => document.getElementById('modal-carrinho').style.display = 'none';

        window.finalizarPedido = () => {
            const txt = window.carrinho.map(i => `${i.nome} (R$ ${i.preco.toFixed(2)})`).join('\n');
            const total = window.carrinho.reduce((acc, i) => acc + i.preco, 0);
            window.location.href = `https://wa.me/5548992225893?text=Olá! Gostaria de finalizar meu pedido:%0A${encodeURIComponent(txt)}%0A%0A*Total: R$ ${total.toFixed(2)}*`;
        };

        window.filtrar = (cat) => {
            window.categoriaAtual = cat;
            window.renderizar();
        };
        
        // Mantido as funções de Admin intactas conforme solicitado
        window.acessarAdmin = () => {
             if (prompt("Senha:") === 'NEWSTYLE26') {
                document.getElementById('areaAdmin').style.display = 'block';
             }
        };
        window.fecharAdmin = () => document.getElementById('areaAdmin').style.display = 'none';
        document.getElementById('formAdminProd').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = Date.now().toString();
            await setDoc(doc(db, "produtos", id), {
                id,
                nome: document.getElementById('adminNome').value,
                categoria: document.getElementById('adminCategoria').value,
                preco: document.getElementById('adminPreco').value,
                f1: document.getElementById('adminF1').value,
                f2: document.getElementById('adminF2').value,
                f3: document.getElementById('adminF3').value
            });
            alert("Salvo!");
            document.getElementById('formAdminProd').reset();
        });

        if(window.carrinho.length > 0) document.getElementById('cart-bar').style.display = 'block';
    </script>
</body>
</html>
