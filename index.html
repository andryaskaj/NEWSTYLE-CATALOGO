<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW STYLE - Catálogo Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo: #050505;
            --surface: #111111;
            --surface-hover: #1e1e1e;
            --accent: #e60000;
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --card-bg: #161616;
            --border: #222222;
        }

        body { 
            background-color: var(--fundo); 
            color: var(--text); 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            padding-bottom: 100px; 
            line-height: 1.6;
        }
        
        header { 
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-bottom: 1px solid var(--border); 
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { 
            font-size: 2rem; 
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--accent); 
            margin: 0; 
            text-transform: uppercase;
        }
        
        .btn-admin-topo { 
            position: absolute; right: 20px; background: transparent; color: var(--text-muted); 
            border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: 0.3s;
        }
        .btn-admin-topo:hover { background: var(--accent); color: white; border-color: var(--accent); }

        .filtros { display: flex; justify-content: center; gap: 10px; padding: 25px 15px; flex-wrap: wrap; }
        .filtros button { 
            background: var(--surface); color: white; border: 1px solid var(--border); 
            padding: 10px 20px; border-radius: 25px; cursor: pointer; transition: 0.3s; font-weight: 500; 
        }
        .filtros button:hover { border-color: var(--accent); }
        .filtros button.ativo { background: var(--accent); border-color: var(--accent); }

        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        .card { 
            background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border);
            padding: 15px; display: flex; flex-direction: column; transition: 0.3s; overflow: hidden;
        }
        .card:hover { transform: translateY(-5px); border-color: #333; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        
        .card img.foto-principal { width: 100%; height: 280px; object-fit: cover; border-radius: 12px; }
        
        .miniaturas { display: flex; gap: 8px; margin: 12px 0; }
        .miniaturas img { width: 60px; height: 60px; object-fit: cover; cursor: pointer; border-radius: 8px; border: 2px solid transparent; }
        .miniaturas img:hover { border-color: var(--accent); }
        
        .card h3 { margin: 12px 0 5px 0; font-size: 1.2rem; font-weight: 600; }
        .categoria-tag { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
        .preco { font-size: 1.4rem; font-weight: 700; color: var(--text); margin: 10px 0; }
        
        .btn-acao { width: 100%; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-acao:hover { background: #ff1a1a; transform: scale(1.02); }
        
        .admin-btns { display: none; margin-top: 15px; }
        .btn-excluir { width: 100%; background: #333; color: #ff6666; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }

        #areaAdmin { display: none; background: #0f0f0f; padding: 30px; margin: 20px auto; border-radius: 20px; max-width: 500px; border: 1px solid var(--accent); }
        #areaAdmin input, #areaAdmin select { width: 100%; padding: 12px; background: #222; color: white; border: 1px solid #333; border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; }

        #cart-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; z-index: 999; }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">NEW STYLE</h1>
        <button onclick="window.acessarAdmin()" class="btn-admin-topo">Painel</button>
    </header>

    <div id="areaAdmin">
        <h2>Cadastrar Produto</h2>
        <form id="formAdminProd">
            <input type="text" id="adminNome" placeholder="Nome da Peça" required>
            <select id="adminCategoria">
                <option value="Camisa">Camisa</option><option value="Bermuda">Bermuda</option>
                <option value="Calça">Calça</option><option value="Jaqueta">Jaqueta</option>
                <option value="Moletom">Moletom</option><option value="Boné">Boné</option>
                <option value="Tênis">Tênis</option><option value="Perfume">Perfume</option>
                <option value="Conjuntos">Conjuntos</option>
            </select>
            <input type="number" id="adminPreco" placeholder="Preço (Ex: 89.90)" step="0.01" required>
            <input type="url" id="adminF1" placeholder="Foto 1 (Principal)" required>
            <input type="url" id="adminF2" placeholder="Foto 2 (Opcional)">
            <input type="url" id="adminF3" placeholder="Foto 3 (Opcional)">
            <button type="submit" class="btn-acao">Salvar Produto</button>
            <button type="button" onclick="window.fecharAdmin()" style="background:transparent; color:#888; width:100%; border:none; padding:10px; margin-top:10px; cursor:pointer;">Fechar Painel</button>
        </form>
    </div>

    <div class="filtros" id="btnsFiltro">
        <button id="btn-todos" class="ativo" onclick="window.filtrar('Todos', this)">Todos</button>
        <button onclick="window.filtrar('Camisa', this)">Camisas</button>
        <button onclick="window.filtrar('Bermuda', this)">Bermudas</button>
        <button onclick="window.filtrar('Calça', this)">Calças</button>
        <button onclick="window.filtrar('Jaqueta', this)">Jaquetas</button>
        <button onclick="window.filtrar('Moletom', this)">Moletons</button>
        <button onclick="window.filtrar('Boné', this)">Bonés</button>
        <button onclick="window.filtrar('Tênis', this)">Tênis</button>
        <button onclick="window.filtrar('Perfume', this)">Perfumes</button>
        <button onclick="window.filtrar('Conjuntos', this)">Conjuntos</button>
    </div>

    <div class="catalogo" id="vitrine"></div>

    <div id="cart-bar" style="display: none;">
        <button onclick="window.finalizarPedido()" class="btn-acao">Finalizar Pedido via WhatsApp 💬</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo9XY0ZVLsFtyxDfRUGSIcqZYpaWnfb9U",
            authDomain: "newstyle-catalogo.firebaseapp.com",
            projectId: "newstyle-catalogo",
            storageBucket: "newstyle-catalogo.firebasestorage.app",
            messagingSenderId: "371496179203",
            appId: "1:371496179203:web:982c39a0f82eee8a10e036",
            measurementId: "G-K7023PTGYY"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        
        window.produtos = [];
        window.carrinho = JSON.parse(localStorage.getItem('newstyle_cart')) || [];
        window.modoAdminAtivo = false;
        window.categoriaAtual = 'Todos';

        if(window.carrinho.length > 0) document.getElementById('cart-bar').style.display = 'block';

        onSnapshot(collection(db, "produtos"), (snap) => {
            window.produtos = [];
            snap.forEach(d => window.produtos.push(d.data()));
            window.renderizar();
        });

        window.renderizar = () => {
            const vitrine = document.getElementById('vitrine');
            vitrine.innerHTML = '';
            
            const listaFiltrada = window.categoriaAtual === 'Todos' 
                ? window.produtos 
                : window.produtos.filter(p => p.categoria === window.categoriaAtual);

            if(listaFiltrada.length === 0) {
                vitrine.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#666; padding: 40px 0;">Nenhum produto nesta categoria.</p>`;
                return;
            }

            listaFiltrada.forEach(p => {
                let htmlMiniaturas = `<img src="${p.f1}" onclick="document.getElementById('imgMain-${p.id}').src='${p.f1}'">`;
                if (p.f2) htmlMiniaturas += `<img src="${p.f2}" onclick="document.getElementById('imgMain-${p.id}').src='${p.f2}'">`;
                if (p.f3) htmlMiniaturas += `<img src="${p.f3}" onclick="document.getElementById('imgMain-${p.id}').src='${p.f3}'">`;

                vitrine.innerHTML += `
                    <div class="card">
                        <span class="categoria-tag">${p.categoria}</span>
                        <img src="${p.f1}" class="foto-principal" id="imgMain-${p.id}" onerror="this.src='https://placehold.co/300x300?text=Sem+Foto'">
                        <div class="miniaturas">${htmlMiniaturas}</div>
                        <h3>${p.nome}</h3>
                        <div class="preco">R$ ${parseFloat(p.preco).toFixed(2).replace('.',',')}</div>
                        <button class="btn-acao" onclick="window.addCarrinho('${p.nome}', '${p.preco}')">Adicionar</button>
                        <div class="admin-btns" id="btnDel-${p.id}" style="display: ${window.modoAdminAtivo ? 'block' : 'none'};">
                            <button class="btn-excluir" onclick="window.excluir('${p.id}')">Excluir Produto</button>
                        </div>
                    </div>`;
            });
        };

        window.addCarrinho = (nome, preco) => {
            window.carrinho.push({ nome, preco: parseFloat(preco) });
            localStorage.setItem('newstyle_cart', JSON.stringify(window.carrinho));
            document.getElementById('cart-bar').style.display = 'block';
            alert(`"${nome}" adicionado!`);
        };

        window.finalizarPedido = () => {
            if(window.carrinho.length === 0) return alert("Carrinho vazio!");
            let total = 0;
            let mensagem = "Olá! Gostaria de fazer o pedido:\n\n";
            window.carrinho.forEach((item, index) => {
                mensagem += `${index + 1}. ${item.nome} — R$ ${item.preco.toFixed(2).replace('.', ',')}\n`;
                total += item.preco;
            });
            mensagem += `\n*Total:* R$ ${total.toFixed(2).replace('.', ',')}`;
            window.location.href = `https://wa.me/5548992225893?text=${encodeURIComponent(mensagem)}`;
        };

        window.filtrar = (cat, btn) => {
            window.categoriaAtual = cat;
            document.querySelectorAll('.filtros button').forEach(b => b.classList.remove('ativo'));
            btn.classList.add('ativo');
            window.renderizar();
        };

        window.acessarAdmin = () => {
            if (prompt("Senha do Administrador:") === 'NEWSTYLE26') {
                window.modoAdminAtivo = true;
                document.getElementById('areaAdmin').style.display = 'block';
                document.querySelectorAll('.admin-btns').forEach(el => el.style.display = 'block');
            } else alert("Senha incorreta!");
        };

        window.fecharAdmin = () => {
            window.modoAdminAtivo = false;
            document.getElementById('areaAdmin').style.display = 'none';
            document.querySelectorAll('.admin-btns').forEach(el => el.style.display = 'none');
        };

        window.excluir = async (id) => {
            if(confirm("Confirmar exclusão?")) {
                await deleteDoc(doc(db, "produtos", String(id)));
            }
        };

        document.getElementById('formAdminProd').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = Date.now().toString();
            await setDoc(doc(db, "produtos", id), {
                id,
                nome: document.getElementById('adminNome').value,
                categoria: document.getElementById('adminCategoria').value,
                preco: document.getElementById('adminPreco').value,
                f1: document.getElementById('adminF1').value,
                f2: document.getElementById('adminF2').value || "",
                f3: document.getElementById('adminF3').value || ""
            });
            document.getElementById('formAdminProd').reset();
            alert("Produto cadastrado!");
        });
    </script>
</body>
</html>
