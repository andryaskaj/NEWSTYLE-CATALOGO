<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW STYLE - Catálogo Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo: #050505;
            --header: #000000;
            --card: #121212;
            --texto: #ffffff;
            --texto-sec: #bbbbbb;
            --accent: #e60000;
        }
        body { background-color: var(--fundo); color: var(--texto); font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 50px; }
        
        header { background-color: var(--header); padding: 20px; display: flex; align-items: center; border-bottom: 2px solid var(--accent); }
        .logo { font-family: 'DynaPuff', cursive; font-size: 2rem; color: var(--accent); margin: 0 auto; text-shadow: 2px 2px 0px #000; }
        
        .filtros { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        button { background: var(--card); color: white; border: 1px solid #333; padding: 8px 15px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button.ativo { background: var(--accent); border-color: var(--accent); }

        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #222; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; }
        .miniaturas { display: flex; gap: 5px; margin: 10px 0; }
        .miniaturas img { width: 30%; height: 60px; object-fit: cover; cursor: pointer; border-radius: 4px; }
        
        .preco { font-size: 1.4rem; font-weight: bold; color: var(--accent); margin: 10px 0; }
        .btn-acao { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; margin-top: 5px; }

        #cart-bar { position: fixed; bottom: 0; width: 100%; background: var(--header); padding: 15px; text-align: center; border-top: 2px solid var(--accent); display: none; }
        #areaAdmin { display: none; background: #1a1a1a; padding: 20px; margin: 20px; border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">NEW STYLE</h1>
        <button onclick="window.acessarAdmin()" style="position:absolute; right: 20px; background: transparent; border: 1px solid #444;">Admin</button>
    </header>

    <div id="areaAdmin">
        <form id="formAdminProd">
            <input type="text" id="nome" placeholder="Nome" required style="width:100%; padding:10px; margin-bottom:5px;">
            <select id="cat" style="width:100%; padding:10px; margin-bottom:5px;">
                <option>Camisa</option><option>Bermuda</option><option>Tênis</option>
            </select>
            <input type="number" id="preco" placeholder="Preço" required style="width:100%; padding:10px; margin-bottom:5px;">
            <input type="url" id="f1" placeholder="Foto Principal" required style="width:100%; padding:10px; margin-bottom:5px;">
            <input type="url" id="f2" placeholder="Foto 2" style="width:100%; padding:10px; margin-bottom:5px;">
            <button type="submit" class="btn-acao">Salvar</button>
        </form>
    </div>

    <div class="filtros" id="btnsFiltro">
        <button class="ativo" onclick="window.filtrar('Todos')">Todos</button>
    </div>

    <div class="catalogo" id="vitrine"></div>

    <div id="cart-bar">
        <button onclick="window.finalizarPedido()" class="btn-acao" style="max-width: 300px;">Finalizar Pedido (WhatsApp)</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo9XY0ZVLsFtyxDfRUGSIcqZYpaWnfb9U",
            authDomain: "newstyle-catalogo.firebaseapp.com",
            projectId: "newstyle-catalogo",
            storageBucket: "newstyle-catalogo.firebasestorage.app",
            messagingSenderId: "371496179203",
            appId: "1:371496179203:web:982c39a0f82eee8a10e036",
            measurementId: "G-K7023PTGYY"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        window.produtos = [];
        window.carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

        onSnapshot(collection(db, "produtos"), (snap) => {
            window.produtos = [];
            snap.forEach(d => window.produtos.push(d.data()));
            window.renderizar(window.produtos);
        });

        window.renderizar = (lista) => {
            const vitrine = document.getElementById('vitrine');
            vitrine.innerHTML = '';
            lista.forEach(p => {
                vitrine.innerHTML += `
                    <div class="card">
                        <img src="${p.f1}" id="imgMain-${p.id}">
                        <div class="miniaturas">
                            <img src="${p.f1}" onclick="document.getElementById('imgMain-${p.id}').src='${p.f1}'">
                            ${p.f2 ? `<img src="${p.f2}" onclick="document.getElementById('imgMain-${p.id}').src='${p.f2}'">` : ''}
                        </div>
                        <h3>${p.nome}</h3>
                        <div class="preco">R$ ${p.preco}</div>
                        <button class="btn-acao" onclick="window.addCarrinho('${p.nome}', '${p.preco}')">Adicionar ao Carrinho</button>
                    </div>`;
            });
        };

        window.addCarrinho = (nome, preco) => {
            window.carrinho.push({nome, preco});
            localStorage.setItem('carrinho', JSON.stringify(window.carrinho));
            document.getElementById('cart-bar').style.display = 'block';
            alert(nome + " adicionado!");
        };

        window.finalizarPedido = () => {
            const itens = window.carrinho.map(i => i.nome).join(', ');
            window.location.href = `https://wa.me/5548999999999?text=Olá! Gostaria de comprar: ${itens}`;
        };

        window.filtrar = (cat) => {
            const filtrados = cat === 'Todos' ? window.produtos : window.produtos.filter(p => p.categoria === cat);
            window.renderizar(filtrados);
        };

        window.acessarAdmin = () => { if(prompt("Senha:") === 'NEWSTYLE26') document.getElementById('areaAdmin').style.display = 'block'; }

        document.getElementById('formAdminProd').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = Date.now().toString();
            await setDoc(doc(db, "produtos", id), {
                id,
                nome: document.getElementById('nome').value,
                categoria: document.getElementById('cat').value,
                preco: document.getElementById('preco').value,
                f1: document.getElementById('f1').value,
                f2: document.getElementById('f2').value
            });
            alert("Sucesso!");
        });
    </script>
</body>
</html>
