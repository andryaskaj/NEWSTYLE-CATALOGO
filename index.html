<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW STYLE - Catálogo Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo: #0a0a0a;
            --header: rgba(0, 0, 0, 0.95);
            --card-fundo: #ffffff; 
            --card-texto: #1a1a1a;
            --texto-claro: #ffffff;
            --accent: #e60000;
        }

        body { background-color: var(--fundo); color: var(--texto-claro); font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 150px; }
        
        header { background-color: var(--header); padding: 20px; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 900; border-bottom: 2px solid var(--accent); }
        .logo { font-family: 'DynaPuff', cursive; font-size: 2.5rem; margin: 0; color: white; }
        .logo-new { color: var(--accent); }

        .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-fundo); color: var(--card-texto); padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; }
        .preco { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
        .btn-acao { width: 100%; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 10px; }

        /* Estilo do Carrinho */
        #cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px; background: #1a1a1a; border-top: 3px solid var(--accent); z-index: 9999; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); display: none; }

        #modal-carrinho { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
        .modal-content { background: #fff; color: #000; width: 100%; max-width: 600px; padding: 25px; border-radius: 20px; }
        
        /* Layout 3 em 3 do Carrinho */
        #lista-carrinho { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .item-cart { border: 1px solid #ccc; padding: 5px; border-radius: 8px; text-align: center; }
        .item-cart img { width: 100%; height: 60px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <header>
        <h1 class="logo"><span class="logo-new">NEW</span> STYLE</h1>
    </header>

    <div class="catalogo" id="vitrine"></div>

    <div id="cart-bar">
        <button onclick="window.abrirCarrinho()" class="btn-acao">🛒 Ver Carrinho</button>
    </div>

    <div id="modal-carrinho" onclick="window.fecharCarrinho()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2>Seu Carrinho</h2>
            <div id="lista-carrinho"></div>
            <div id="total-carrinho" style="font-weight: bold; font-size: 1.2rem; margin-top: 15px;"></div>
            <button onclick="window.finalizarPedido()" class="btn-acao" style="margin-top:20px; background: #25d366;">Finalizar (WhatsApp)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo9XY0ZVLsFtyxDfRUGSIcqZYpaWnfb9U",
            authDomain: "newstyle-catalogo.firebaseapp.com",
            projectId: "newstyle-catalogo",
            storageBucket: "newstyle-catalogo.firebasestorage.app",
            messagingSenderId: "371496179203",
            appId: "1:371496179203:web:982c39a0f82eee8a10e036"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        window.carrinho = JSON.parse(localStorage.getItem('newstyle_cart')) || [];

        window.atualizarBarra = () => {
            const bar = document.getElementById('cart-bar');
            bar.style.display = window.carrinho.length > 0 ? 'block' : 'none';
        };

        // Adiciona foto no carrinho para exibir corretamente
        window.add = (nome, preco, foto) => {
            window.carrinho.push({ nome, preco, foto });
            localStorage.setItem('newstyle_cart', JSON.stringify(window.carrinho));
            window.atualizarBarra();
        };

        window.abrirCarrinho = () => {
            document.getElementById('modal-carrinho').style.display = 'flex';
            const lista = document.getElementById('lista-carrinho');
            const totalDiv = document.getElementById('total-carrinho');
            let total = 0;
            
            lista.innerHTML = '';
            window.carrinho.forEach((item, index) => {
                total += parseFloat(item.preco);
                lista.innerHTML += `
                    <div class="item-cart">
                        <img src="${item.foto}">
                        <div style="font-size: 0.7rem;">${item.nome}</div>
                        <div style="font-weight:bold;">R$ ${item.preco}</div>
                    </div>`;
            });
            totalDiv.innerText = "Total: R$ " + total.toFixed(2);
        };

        window.fecharCarrinho = () => document.getElementById('modal-carrinho').style.display = 'none';

        window.finalizarPedido = () => {
            let total = 0;
            const itens = window.carrinho.map(i => {
                total += parseFloat(i.preco);
                return `${i.nome} (R$ ${i.preco})`;
            }).join(', ');
            
            const msg = `Pedido: ${itens}. Total: R$ ${total.toFixed(2)}`;
            window.location.href = `https://wa.me/5548992225893?text=${encodeURIComponent(msg)}`;
        };

        onSnapshot(collection(db, "produtos"), (s) => {
            const v = document.getElementById('vitrine');
            v.innerHTML = '';
            s.forEach(d => {
                const p = d.data();
                v.innerHTML += `
                    <div class="card">
                        <img src="${p.f1}">
                        <h3>${p.nome}</h3>
                        <p class="preco">R$ ${p.preco}</p>
                        <button class="btn-acao" onclick="window.add('${p.nome}', '${p.preco}', '${p.f1}')">Adicionar</button>
                    </div>`;
            });
        });

        window.atualizarBarra();
    </script>
</body>
</html>
